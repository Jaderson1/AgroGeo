services:
  db:
    image: postgis/postgis:16-3.4
    container_name: agrogeo-db
    environment:
      POSTGRES_DB: agrogeo
      POSTGRES_USER: agrogeo
      POSTGRES_PASSWORD: agrogeo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrogeo -d agrogeo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: agrogeo-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
